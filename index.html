<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0" />
    <title>Wish Planner</title>

    <link data-trunk
          rel="rust"
          data-bin="wish"
          data-wasm-opt="z" />


    <link data-trunk
          rel="icon"
          href="favicon.ico" />
    <link data-trunk
          rel="copy-file"
          href="sw.js" />
    <link data-trunk
          rel="copy-dir"
          href="resources" />

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1b1b1b;
        }

        canvas#canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker
                    .register("./sw.js")
                    .then((registration) => {
                        console.log("ServiceWorker registration successful");
                    })
                    .catch((error) => {
                        console.error("ServiceWorker registration failed:", error);
                    });
            });
        }
    </script>
    <script type="module">
        import init, { WebHandle } from "./pkg/wish_lib.js";
        async function run() {
            await init();
            const handle = new WebHandle();
            const canvas = document.getElementById("canvas");
            await handle.start(canvas);
        }
        run().catch(console.error);
    </script>
</body>



</html>
